name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  fast:
    # Phase 76 / Task 76.6: the push lane. Pure-Python tests only -- no C
    # compiler invocation -- so it finishes in seconds rather than 16 minutes.
    # A red X here means something definite; the 16-minute suite runs on PRs
    # and on the platform jobs below.
    name: Fast lane (pure Python, no compiler)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run the fast lane
        run: |
          python -m pytest tests -q -m fast

  deps-lock:
    # Phase 72 / Task 72.7: builds and verifies multi-level dependency graphs
    # offline from fixtures, validating semver resolution, lockfile pinning,
    # transitive fetching, and lock verification.
    if: github.event_name != 'push'
    name: Dependency lock and offline graph (deps-lock)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Bootstrap self-hosted Velo compiler (3-stage Gen1 -> Gen2 -> Gen3)
        run: |
          bash scripts/bootstrap.sh --full

      - name: Verify bootstrap determinism
        run: |
          python3 scripts/check_determinism.py

      - name: Verify code formatting (velo fmt --check)
        run: |
          python3 scripts/check_formatting.py --changed

      - name: Run package and dependency graph test suite
        run: |
          python3 -m pytest tests/test_pkg_semver.py tests/test_pkg_tree_verify.py tests/test_pkg_install_fetches.py tests/test_pkg_publish.py tests/test_pkg_registry.py tests/test_pkg_resolve.py tests/test_pkg_security.py -q


  linux:
    # Phase 76 / Task 76.6: the heavy jobs run on pull requests and manual
    # dispatch, not on every push. The `fast` job above is the push lane; a
    # push that breaks only compiler-dependent tests gets its red X from the
    # pull request that carries it.
    if: github.event_name != 'push'
    name: Linux (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        compiler: [gcc, clang]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Install Clang (if selected)
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Bootstrap self-hosted Velo compiler (3-stage Gen1 -> Gen2 -> Gen3)
        env:
          CC: ${{ matrix.compiler }}
        run: |
          bash scripts/bootstrap.sh --full

      - name: Verify bootstrap determinism
        run: |
          python3 scripts/check_determinism.py

      - name: Verify code formatting (velo fmt --check)
        run: |
          python3 scripts/check_formatting.py --changed

      - name: Run test suite
        run: |
          python3 -m pytest tests -q

  macos:
    # Phase 76 / Task 76.6: the heavy jobs run on pull requests and manual
    # dispatch, not on every push. The `fast` job above is the push lane; a
    # push that breaks only compiler-dependent tests gets its red X from the
    # pull request that carries it.
    if: github.event_name != 'push'
    name: macOS (Apple Silicon - ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest

      - name: Bootstrap self-hosted Velo compiler (3-stage Gen1 -> Gen2 -> Gen3)
        env:
          CC: clang
        run: |
          bash scripts/bootstrap.sh --full

      - name: Verify bootstrap determinism
        run: |
          python3 scripts/check_determinism.py

      - name: Verify code formatting (velo fmt --check)
        run: |
          python3 scripts/check_formatting.py --changed

      - name: Run test suite
        run: |
          python3 -m pytest tests -q

  windows-gcc:
    # Phase 76 / Task 76.6: the heavy jobs run on pull requests and manual
    # dispatch, not on every push. The `fast` job above is the push lane; a
    # push that breaks only compiler-dependent tests gets its red X from the
    # pull request that carries it.
    if: github.event_name != 'push'
    name: Windows Server 2022 (MSYS2 UCRT64 GCC)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Install Python test runner
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Add MSYS2 UCRT64 to PATH
        shell: bash
        run: |
          echo "C:/msys64/ucrt64/bin" >> $GITHUB_PATH

      - name: Bootstrap self-hosted Velo compiler (3-stage Gen1 -> Gen2 -> Gen3)
        shell: cmd
        run: |
          scripts\bootstrap.bat --full

      - name: Verify bootstrap determinism
        run: |
          python scripts/check_determinism.py

      - name: Verify code formatting (velo fmt --check)
        run: |
          python scripts/check_formatting.py --changed

      - name: Run test suite
        run: |
          python -m pytest tests -q

  windows-msvc:
    # Phase 76 / Task 76.6: the heavy jobs run on pull requests and manual
    # dispatch, not on every push. The `fast` job above is the push lane; a
    # push that breaks only compiler-dependent tests gets its red X from the
    # pull request that carries it.
    if: github.event_name != 'push'
    name: Windows Server 2022 (MSVC cl.exe)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Python test runner
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Bootstrap Velo compiler with MSVC
        shell: cmd
        run: |
          scripts\bootstrap.bat

      - name: Build self-hosted compiler using MSVC backend
        shell: cmd
        run: |
          bin\velo.exe build src/main.vl --cc cl -o bin\velo_msvc.exe

      - name: Verify MSVC binary execution
        shell: cmd
        run: |
          bin\velo_msvc.exe version

      # Phase 76 / Task 76.5: this job used to run only two test files, so the
      # MSVC backend was verified for 2 of 132. Run the whole suite against the
      # MSVC-built compiler: VELO_BIN makes conftest.velo_exe() resolve to it,
      # which is why the tests no longer need an MSVC-specific path.
      - name: Run the full suite against the MSVC-built compiler
        env:
          VELO_BIN: bin\velo_msvc.exe
        run: |
          python -m pytest tests -q

  clean-checkout:
    # Phase 76 / Task 76.6: the heavy jobs run on pull requests and manual
    # dispatch, not on every push. The `fast` job above is the push lane; a
    # push that breaks only compiler-dependent tests gets its red X from the
    # pull request that carries it.
    if: github.event_name != 'push'
    name: Clean checkout (no hidden local state)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # Phase 67: the suite must pass with no untracked directory present.
      # Eight Velo tests used to write into a relative `scratch/` without
      # creating it, so they passed only on machines where an earlier run had
      # left the directory behind. `actions/checkout` guarantees a clean tree
      # here, and the step below asserts it stays clean.
      - name: Confirm the checkout has no ambient scratch directory
        run: |
          if [ -e scratch ]; then
            echo "::error::a scratch/ directory exists in a clean checkout"
            exit 1
          fi
          echo "No ambient scratch/ directory present."

      - name: Bootstrap self-hosted Velo compiler (3-stage Gen1 -> Gen2 -> Gen3)
        run: |
          bash scripts/bootstrap.sh --full

      - name: Verify bootstrap determinism
        run: |
          python3 scripts/check_determinism.py

      - name: Verify code formatting (velo fmt --check)
        run: |
          python3 scripts/check_formatting.py --changed

      # The gate runs under git, which is initialized regardless, so it diffs
      # the filesystem (catches new and empty directories) and git status
      # (catches modifications to tracked files) before and after the suite.
      # Build products are allowlisted; anything else fails the job.
      - name: Run test suite under the clean-tree gate
        run: |
          python3 scripts/check_clean_tree.py -- python3 -m pytest tests -q

  sanitizer:
    # Phase 76 / Task 76.6: the heavy jobs run on pull requests and manual
    # dispatch, not on every push. The `fast` job above is the push lane; a
    # push that breaks only compiler-dependent tests gets its red X from the
    # pull request that carries it.
    if: github.event_name != 'push'
    name: Linux Sanitizer (ASan + UBSan - clang)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Install Clang and Sanitizer runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libasan8 libubsan1

      - name: Run the runtime zone harness under ASan + UBSan
        env:
          CC: clang
          VELO_CFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          VELO_LDFLAGS: "-fsanitize=address,undefined"
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:abort_on_error=1"
        run: |
          python3 -m pytest tests/test_runtime_zone.py -q

      - name: Bootstrap self-hosted Velo compiler under ASan + UBSan (3-stage Gen1 -> Gen2 -> Gen3)
        env:
          CC: clang
        run: |
          bash scripts/bootstrap_sanitized.sh --full --no-test

      - name: Run full test suite under ASan + UBSan
        env:
          CC: clang
          VELO_CFLAGS: "-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          VELO_LDFLAGS: "-fsanitize=address,undefined"
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:abort_on_error=1"
        run: |
          ./bin/velo run std/tests/mem/defer_test.vl --cc clang
          python3 -m pytest tests -q

